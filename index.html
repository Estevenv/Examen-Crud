<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de TAREAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-12 bg-danger text-white p-3">
        <h1 class="text-center">CRUD de TAREAS</h1>
        <form class="row g-3">
          <div class="col-9">
            <input type="text" class="campoTexto form-control" placeholder="Escribe una tarea...">
          </div>
          <div class="col-3">
            <button type="button" class="boton btn btn-success">Crear Tarea</button>
          </div>
        </form>
      </div>
      <div class="col-12 mt-3">
        <table class="table table-bordered table-hover">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>NOMBRE TAREA</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaTareas">
            <!-- Aquí se insertan las tareas -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="funciones.js"></script>
</body>
</html>
